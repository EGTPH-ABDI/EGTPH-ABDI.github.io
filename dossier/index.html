function expTxt(w){if(w.exm==="manuel"&&w.exv)return w.exv;if(!w.et)return "–";const d0=new Date(w.et),d1=new Date();if(isNaN(d0))return "–";let y=d1.getFullYear()-d0.getFullYear(),m=d1.getMonth()-d0.getMonth();if(d1.getDate()<d0.getDate())m--;if(m<0){y--;m+=12;}if(y<0){y=0;m=0;}const p=[];if(y>0)p.push(y+" "+(y>1?"ans":"an"));if(m>0)p.push(m+" mois");return p.join(" ")||"0 mois";}
/* lecture d'une attestation de bonne exécution (texte OCR) */
function extractABE(text){
  const T=String(text||"").replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/‎|‏|‪|‫|‬/g,"");
  const one=T.replace(/\s+/g," ");
  const D="(\\d{1,2}[\\/.\\-]\\d{1,2}[\\/.\\-]\\d{4}|\\d{4}[\\/.\\-]\\d{1,2}[\\/.\\-]\\d{1,2})";
  const iso=s=>{if(!s)return "";let m=s.match(/^(\d{4})\D(\d{1,2})\D(\d{1,2})$/);if(m)return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;m=s.match(/^(\d{1,2})\D(\d{1,2})\D(\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:"";};
  const num=s=>{s=String(s).trim();if(/,\d{2}$/.test(s))s=s.replace(/[.\s]/g,"").replace(",",".");else s=s.replace(/[.\s,]/g,"");return Number(s)||0;};
  const r={};
  let m=one.match(/(بلدية|ولاية|مديرية|الوكالة|الديوان)\s+([^\s،,:]+(?:\s+[^\s،,:]+){0,2})/);if(m)r.owner_ar=(m[1]+" "+m[2]).replace(/\s*(مصلحة|دائرة|الرقم).*$/,"").trim();
  m=one.match(/مشروع\s*[:：]?\s*(.{10,260}?)\s*(?:بموجب|طبقا|طبقًا|وفقا|حسب|المسجل|المسجلة|«|»|\(برنامج)/);if(m)r.proj_ar=m[1].replace(/[«»"]/g,"").replace(/\s*[:.،,]\s*$/,"").trim();
  m=one.match(new RegExp("(الصفقة|صفقة|الاتفاقية|اتفاقية|العقد|الاتفاقية رقم)\\s*رقم\\s*[:]?\\s*([0-9A-Za-z\\/\\-]+)\\s*(?:المؤرخة|المؤرخ|بتاريخ|في)?\\s*(?:في)?\\s*[:]?\\s*"+D+"?"));
  if(m){r.contract=m[2]+(m[3]?" du "+m[3].replace(/-/g,"/"):"");r.contract_kind=/اتفاقي/.test(m[1])?"conv":"marche";r.contract_date=iso(m[3]);}
  m=one.match(/(?:بمبلغ|قدره|قدرها|المبلغ)[^0-9]{0,40}?(\d{1,3}(?:[.\s]\d{3})+(?:,\d{2})?)\s*(?:دج|DA|د\.ج)/);if(m)r.amount=num(m[1]);
  m=one.match(/(?:مدة|بمدة|آجال|اجال)\s*(?:إنجاز|انجاز|الإنجاز|الانجاز)?[^()]{0,40}\(\s*(\d{1,3})\s*\)\s*(يوما|يوم|أيام|ايام|شهرا|شهر|أشهر|اشهر)?/);
  if(!m)m=one.match(/(?:مدة|بمدة)\s*(?:إنجاز|انجاز)?\s*(?:قدرها)?\s*[:]?\s*(\d{1,3})\s*(يوما|يوم|أيام|ايام|شهرا|شهر|أشهر|اشهر)/);
  if(m){r.delay_n=+m[1];r.delay_u=/شه/.test(m[2]||"")?"mois":"jours";}
  m=one.match(new RegExp("استلام\\S*\\s*(?:\\S+\\s*){0,6}?بتاريخ\\s*[:]?\\s*"+D));if(m)r.reception=iso(m[1]);
  r.final=/(نهائي|نهائيا|définitive)/.test(one);
  const pipes=[];T.split(/\n/).forEach(l=>{if(!/(قنا[ةه]|قنوات|انابيب|أنابيب|conduite|canalisation)/i.test(l))return;
    const dn=(l.match(/(?:قطر|Ø|DN|ø)\s*(\d{2,4})/i)||l.match(/(\d{2,4})\s*مم/)||[])[1];
    const U="(?:مط|م\\.ط|م ط|مل|ml|m\\.l|متر\\s*خطي|مترخطي|م\\.خ|م خ|mètres? linéaires?)";
    const lm=l.match(new RegExp("(\\d[\\d.,]{1,8})\\s*"+U,"i"))||l.match(new RegExp(U+"\\s*\\|?\\s*(\\d[\\d.,\\s]{0,8})\\s*$","i"))||l.match(/بطول\s*(?:قدره)?\s*[:]?\s*(\d[\d.,]{1,8})/);
    if(lm){const len=num(lm[1]);if(len>0&&len<100000&&(!dn||String(len)!==String(+dn)))pipes.push({dn:+dn||0,len,mat:/annel|حلزون|مموج/i.test(l)?"Annelé":/pehd|بولي/i.test(l)?"PEHD":/pvc/i.test(l)?"PVC":/خرسان|béton|بيتون/i.test(l)?"Béton":""});}});
  if(pipes.length){r.pipes=pipes;r.length=pipes.reduce((a,p)=>a+p.len,0);}
  const dts=[...one.matchAll(new RegExp(D,"g"))].map(x=>iso(x[1])).filter(Boolean).sort();if(dts.length)r.date=dts[dts.length-1];
  r.aep=/(الشرب|الماء الصالح|eau potable|\bAEP\b)/i.test(one);
  return r;
}

/* date de validité dans un texte : après « valable jusqu'au », « à jour … au », « صالحة إلى غاية »… */
function validityIn(text){const t=String(text||"").replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/\s+/g," ");
  const D="(\\d{1,2}[\\/.\\-]\\s?\\d{1,2}[\\/.\\-]\\s?\\d{4}|\\d{4}[\\/.\\-]\\d{1,2}[\\/.\\-]\\d{1,2})";
  const re=new RegExp("(?:valable jusqu|jusqu'au|jusqu’au|à jour[^.]{0,80}?au|a jour[^.]{0,80}?au|validit[ée][^.]{0,30}?|صالحة[^.]{0,30}?|صلاحية[^.]{0,30}?|إلى غاية|الى غاية|لغاية|تاريخ الانتهاء|تاريخ الإنتهاء)\\s*[:]?\\s*"+D,"i");
  const m=t.match(re);if(!m)return "";const s=m[1].replace(/\s/g,"");let x=s.match(/^(\d{4})\D(\d{1,2})\D(\d{1,2})$/);if(x)return `${x[1]}-${x[2].padStart(2,"0")}-${x[3].padStart(2,"0")}`;x=s.match(/^(\d{1,2})\D(\d{1,2})\D(\d{4})$/);return x?`${x[3]}-${x[2].padStart(2,"0")}-${x[1].padStart(2,"0")}`:"";}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fd=s=>{const m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:(s||"");};
const money=v=>{const n=Math.round(Number(v)*100)/100,[i,d]=n.toFixed(2).split(".");return i.replace(/\B(?=(\d{3})+(?!\d))/g,".")+","+d;};
function toast(m,ms){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",ms||2600);}
function prog(t,f,s){const p=$("#prog");if(t===false){p.style.display="none";return;}p.style.display="flex";$("#progT").textContent=t;$("#progB").style.width=Math.round((f||0)*100)+"%";$("#progS").textContent=s||"";}
function modal(html){$("#mbox").innerHTML=html;$("#modal").style.display="flex";}

const viewer=()=>{try{return EGTPHAuth.isViewer("dossier");}catch(e){return false;}};
async function fget(c,path,q){const r=await fetch(c.url+path+".json?auth="+encodeURIComponent(tok(c.app))+(q||""),{cache:"no-store"});if(!r.ok)throw new Error("GET "+r.status+" "+path);return r.json();}

let _db=null;
function idb(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open("egtph_dossier",1);r.onupgradeneeded=()=>r.result.createObjectStore("c");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));}
async function cget(k){try{const db=await idb();return await new Promise(res=>{const q=db.transaction("c").objectStore("c").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined);});}catch(e){return undefined;}}
async function cset(k,v){try{const db=await idb();await new Promise(res=>{const t=db.transaction("c","readwrite");t.objectStore("c").put(v,k);t.oncomplete=res;t.onerror=res;});}catch(e){}}

function fileToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("img"));i.src=src;});}

function eqMod(e){return String(e&&e._mod||0);}
async function parcImg(e,k){const key=e.id+"_"+k;if(!S.imgKeys.has(key))return null;const ck="p:"+key+":"+eqMod(e);let v=await cget(ck);if(v)return v;v=await fget(PARC,PARC.base+"_img/"+key);if(v)await cset(ck,v);return v;}
async function rhFile(k){const f=S.rhFiles[k];if(!f)return null;const ck="r:"+k+":"+f.ms;let v=await cget(ck);if(!v){v=await fget(RH,RH.base+"/files/"+k);if(!v||v.deleted||!v.b64){f.deleted=true;return null;}await cset(ck,v);}
  const meta={ms:f.ms,label:v.label||"",name:v.name||"",type:v.type||"",meta:v.meta||null};Object.assign(f,meta);await cset("rm:"+k,meta);return v;}
let _pdfjs=null;
function pdfjs(){if(_pdfjs)return _pdfjs;return _pdfjs=new Promise((res,rej)=>{if(window.pdfjsLib)return res(window.pdfjsLib);const s=document.createElement("script");s.src="../vendor/pdfjs/pdf.min.js";
  s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=new URL("../vendor/pdfjs/pdf.worker.min.js",location.href).href;res(window.pdfjsLib);};s.onerror=()=>{_pdfjs=null;rej(new Error("pdf.js"));};document.head.appendChild(s);});}
function b64bytes(b64){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function pdfToJpegs(bytes,dpi,maxSide){const L=await pdfjs();const doc=await L.getDocument({data:bytes}).promise;const out=[];
  for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);let vp=pg.getViewport({scale:(dpi||200)/72});const m=Math.max(vp.width,vp.height);if(maxSide&&m>maxSide)vp=pg.getViewport({scale:(dpi||200)/72*maxSide/m});
    const cv=document.createElement("canvas");cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);
    await pg.render({canvasContext:x,viewport:vp}).promise;out.push(cv);}
  return out;}
/* pages d'un fichier RH → JPEG (cache) */
async function rhPages(k){const f=S.rhFiles[k];if(!f)return [];const ck="rp:"+k+":"+f.ms;const c=await cget(ck);if(c)return c;
  const v=await rhFile(k);if(!v)return [];let pages=[];
  if(/pdf/i.test(v.type||"")||/\.pdf$/i.test(v.name||"")){const cvs=await pdfToJpegs(b64bytes(v.b64),200,2300);pages=cvs.map(cv=>({src:cv.toDataURL("image/jpeg",0.8),w:cv.width,h:cv.height}));}
  else{const src="data:"+(v.type||"image/jpeg")+";base64,"+v.b64;const im=await loadImg(src);pages=[{src,w:im.naturalWidth,h:im.naturalHeight}];}
  await cset(ck,pages);return pages;}

function addDays(s,n){const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}

async function srcPages(it){/* → [{src,w,h}] (images verticales prêtes) */
  if(it.src==="d")return Promise.all((it.refs||[]).map(async r=>({src:await dossierPage(r),w:r.w,h:r.h})));

function fit(w,h,bw,bh){const s=Math.min(bw/w,bh/h);return [w*s,h*s];}
async function embed(pdf,src){const b=b64bytes(src.split(",")[1]);return /^data:image\/png/.test(src)?pdf.embedPng(b):pdf.embedJpg(b);}
/* faces : [{draw:async(pdf)=>page}] — une entrée par page imprimée */
async function itemFaces(it,mode){
  const gray=mode==="print",wb=gray&&S.settings.whiten!==false;
  const conv=async s=>gray?await grayJpeg(s,wb):s;
  if(it.t==="cover"||it.t==="sep"||it.t==="fin"){await fontsReady();const cv=it.t==="cover"?drawCover(new Date().getFullYear()):drawSep(it.t==="fin"?Object.assign({},it,{level:1}):it);
    const src=cv.toDataURL("image/png");return [{w:AW,h:AH,imgs:[{src,box:[0,0,AW,AH]}]}];}
  const ps=await srcPages(it);if(!ps.length)return [];
  if(it.layout==="pair"){/* A4 paysage : carte grise à droite, assurance à gauche */
    const W=AH,H=AW,gap=14,aw=W-2*MARGIN-gap*(ps.length-1),ah=H-2*MARGIN,rs=ps.map(p=>p.w/p.h),hh=Math.min(ah,aw/rs.reduce((a,b)=>a+b,0));
    let xr=(W+rs.reduce((a,r)=>a+r*hh,0)+gap*(ps.length-1))/2;const imgs=[];
    for(let i=0;i<ps.length;i++){const ww=rs[i]*hh;imgs.push({src:await conv(ps[i].src),box:[xr-ww,(H-hh)/2,ww,hh]});xr-=ww+gap;}
    return [{w:W,h:H,imgs}];}
  if(it.layout==="stack"){const n=ps.length,cell=(AH-2*MARGIN-30)/n,imgs=[];
    for(let i=0;i<n;i++){const bx=[70,MARGIN+15+i*cell+10,AW-140,cell-20],[w,h]=fit(ps[i].w,ps[i].h,bx[2],bx[3]);imgs.push({src:await conv(ps[i].src),box:[bx[0]+(bx[2]-w)/2,bx[1]+(bx[3]-h)/2,w,h]});}
    return [{w:AW,h:AH,imgs}];}
  const out=[];for(const p of ps){const land=p.w>p.h*1.05,W=land?AH:AW,H=land?AW:AH,[w,h]=fit(p.w,p.h,W-2*MARGIN,H-2*MARGIN);
    out.push({w:W,h:H,imgs:[{src:await conv(p.src),box:[(W-w)/2,(H-h)/2,w,h]}]});}
  return out;}
async function drawFace(pdf,f){const pg=pdf.addPage([f.w,f.h]);for(const im of (f.imgs||[])){const e=await embed(pdf,im.src);const [x,yTop,w,h]=im.box;pg.drawImage(e,{x,y:f.h-yTop-h,width:w,height:h});}return pg;}
/* plan recto verso : chaque pièce commence sur une nouvelle feuille ; pièce non recto-verso = recto seul */
function duplexSeq(groups){const seq=[];groups.forEach(g=>{if(seq.length%2)seq.push(null);g.faces.forEach(f=>{seq.push(f);if(!g.duplex)seq.push(null);});});
  while(seq.length&&seq[seq.length-1]===null)seq.pop();if(seq.length%2)seq.push(null);return seq;}
function blankLike(prev){return {w:prev?prev.w:AW,h:prev?prev.h:AH,imgs:[]};}
async function makePdf(faces){const pdf=await PDFLib.PDFDocument.create();pdf.setTitle("Dossier de l'entreprise — EGTPH ABDI YOUSSOUF ISLAM");pdf.setAuthor("EGTPH");
  let prev=null;for(let i=0;i<faces.length;i++){const f=faces[i]||blankLike(prev);await drawFace(pdf,f);prev=f;}return pdf.save();}
/* génération : écran (couleur, sans blancs) + impression (gris, plan recto verso / manuel / recto) */
async function generate(items,o){
  const screen=[],groups=[];
  for(let i=0;i<items.length;i++){const it=items[i];prog("تجهيز الصفحات…",i/items.length*0.55,it.ar||it.label||"");
    const fc=await itemFaces(it,"screen");const fp=o.print?await itemFaces(it,"print"):[];
    fc.forEach(f=>screen.push(f));if(o.print)groups.push({faces:fp,duplex:it.t==="doc"&&it.duplex,it});
    it.pages=fc.length;}
  prog("إنشاء PDF الشاشة (ملون)…",0.6);const out={screen:await makePdf(screen),nScreen:screen.length};
  if(o.print){let seq;
    if(o.mode==="simplex"){seq=[];groups.forEach(g=>g.faces.forEach(f=>seq.push(f)));}
    else seq=duplexSeq(groups);
    out.faces=seq.length;out.sheets=o.mode==="simplex"?seq.length:Math.ceil(seq.length/2);out.blanks=seq.filter(x=>!x).length;
    prog("إنشاء PDF الطباعة (رمادي)…",0.8);
    if(o.mode==="manual"){const odd=seq.filter((_,i)=>i%2===0),even=seq.filter((_,i)=>i%2===1);if(o.reverseBacks)even.reverse();
      out.p1=await makePdf(odd);out.p2=await makePdf(even);}
    else out.print=await makePdf(seq);
    /* contrôle : pages entrées = pages sorties */
    const pin=groups.reduce((a,g)=>a+g.faces.length,0),pout=seq.filter(Boolean).length;out.check=pin===pout&&pin===screen.length;}
  prog(false);return out;}

async function setStamp(f){if(!f)return;const im=await loadImg(await fileToDataURL(f));const k=Math.min(1,900/Math.max(im.naturalWidth,im.naturalHeight)),cv=document.createElement("canvas");cv.width=Math.round(im.naturalWidth*k);cv.height=Math.round(im.naturalHeight*k);const x=cv.getContext("2d",{willReadFrequently:true});x.drawImage(im,0,0,cv.width,cv.height);
  const id=x.getImageData(0,0,cv.width,cv.height),d=id.data;for(let i=0;i<d.length;i+=4){const l=(d[i]+d[i+1]+d[i+2])/3,mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);if(l>205&&mx-mn<40)d[i+3]=0;else if(l>170&&mx-mn<30)d[i+3]=Math.round(255*(205-l)/35);}x.putImageData(id,0,0);
  await saveSet("stamp",cv.toDataURL("image/png"));vSet();}

  S.settings.bases=(S.settings.bases||[]).concat({url,key,label:url.replace(/^https:\/\/|-default-rtdb.*$/g,""),cap:1000});await saveSet("bases",S.settings.bases);vSet();}

function gOf(cv,max){const s=Math.min(1,(max||1200)/Math.max(cv.width,cv.height)),c=document.createElement("canvas");c.width=Math.round(cv.width*s);c.height=Math.round(cv.height*s);const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(cv,0,0,c.width,c.height);return EGTPHDoc.toGray(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);}
async function fileCanvases(f){
  if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)){return pdfToJpegs(new Uint8Array(await f.arrayBuffer()),200,2300);}
  let g=f;try{if(window.EGTPHScan&&EGTPHScan.autoFile)g=await EGTPHScan.autoFile(f)||f;}catch(e){}
  const im=await loadImg(await fileToDataURL(g));const s=Math.min(1,2300/Math.max(im.naturalWidth,im.naturalHeight)),cv=document.createElement("canvas");cv.width=Math.round(im.naturalWidth*s);cv.height=Math.round(im.naturalHeight*s);
  const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);
  try{cv._cut=EGTPHDoc.edgeCut(gOf(cv,1000)).cut;}catch(e){cv._cut=[];}return [cv];}
async function readFiles(files){if(!files.length)return;msg("جارٍ القراءة والتنظيف…","mu");
  for(let i=0;i<files.length;i++){prog("معالجة "+(i+1)+"/"+files.length,i/files.length,files[i].name);let cvs=[];try{cvs=await fileCanvases(files[i]);}catch(e){msg("تعذّرت قراءة "+esc(files[i].name),"errbox");}
    cvs.forEach(cv=>{cv._file=i;ED.pages.push({cv,rot:0});});}
  prog(false);
  /* pages blanches et doublons (gardés à part, signalés) */
  const notes=[];const kept=[];const hashes=[];
  ED.pages.forEach((p,i)=>{try{const g=gOf(p.cv);if(EGTPHDoc.blankInfo(g).blank){notes.push("صفحة بيضاء حُذفت ("+(i+1)+")");return;}const h=EGTPHDoc.dHash(g);
    if(hashes.some(x=>EGTPHDoc.hamming(x,h)<=6)){notes.push("صفحة مكررة حُذفت ("+(i+1)+")");return;}hashes.push(h);p.q=EGTPHDoc.quality(g);}catch(e){}kept.push(p);});
  ED.pages=kept;
  if($("#eBest").checked&&ED.pages.length>1){const b=ED.pages.reduce((a,p)=>((p.q&&p.q.score)||0)>((a.q&&a.q.score)||0)?p:a);ED.pages=[b];notes.push("اختيرت النسخة الأوضح");}
  ED.pages.forEach(p=>{if(p.cv._cut&&p.cv._cut.length)notes.push("⚠️ الوثيقة تبدو مقطوعة ("+p.cv._cut.join("، ")+") — أعد التصوير إن أمكن");});
  drawThumbs();
  /* lecture + classement (règles + modèle appris) */
  try{msg((notes.length?notes.join("<br>")+"<br>":"")+"🔍 قراءة النص…","mu");const r=await EGTPHOcr.recognize(ED.pages[0].cv,"ara+fra",{fast:true});ED.text=(r&&r.data&&r.data.text)||"";const rr=r&&r.data&&r.data.rotation;if(rr){ED.pages[0].rot=rr%360;drawThumbs();notes.push("تم تصحيح اتجاه الصفحة تلقائياً");}}catch(e){ED.text="";}
  suggest(notes);}
function parsePipes(s){return String(s||"").split(/[;\n،]+/).map(x=>x.trim()).filter(Boolean).map(x=>{const dn=(x.match(/[ØøDN]\s*(\d{2,4})/i)||[])[1],len=(x.match(/[:=]\s*([\d.,\s]+)$/)||x.match(/(\d[\d.,]*)\s*$/)||[])[1],mat=(x.match(/annel[ée]|pehd|pvc|b[ée]ton/i)||[""])[0];
  return len?{dn:+dn||0,len:Number(String(len).replace(/[\s.]/g,"").replace(",","."))||0,mat:mat?mat.charAt(0).toUpperCase()+mat.slice(1).toLowerCase().replace("annele","Annelé"):""}:null;}).filter(x=>x&&x.len);}
function setV(id,v){const e=$("#"+id);if(e&&!e.value&&v!=null&&v!=="")e.value=v;}
function suggest(notes){const t=ED.text||"";let h=notes.length?notes.join("<br>")+"<br>":"";
  if(t&&window.EGTPHDoc){const d=EGTPHDoc.decide(t,S.model),x=EGTPHDoc.extract(t),ds=x.dates;
    if(d.type&&TYPE_ELSE[d.type]){h+=`<b>هذه الوثيقة تبدو «${d.type}» وتُحفظ في برنامج ${TYPE_ELSE[d.type]==="p"?"العتاد (parc_document)":"العمال (egtph-rh)"}</b> — ستظهر هنا تلقائياً بعد حفظها هناك. <button class="b" onclick="openSrc('${TYPE_ELSE[d.type]}')">فتح البرنامج</button><br>`;}
    else if(d.type&&TYPE2[d.type]){let cat={rc:"jur",nif:"jur",nis:"jur",role:"fis",qualif:"qual",casnos:"para",bilan:"bilan",rib:"rib"}[TYPE2[d.type]];
      if(TYPE2[d.type]==="abe")cat=/الشرب|eau potable|\baep\b/i.test(t)?"abe_aep":"abe_ass";
      h+=`النوع المقترح: <b>${esc((CATS[cat]||[cat])[0])}</b> ${d.sure?'<span class="ok">(مؤكد)</span>':'<span class="wa">(للتأكيد)</span>'}<br>`;
      if(!ED.id&&!$("#eCat").value){$("#eCat").value=cat;ED.cat=cat;$("#abeF").style.display=cat.startsWith("abe")?"":"none";const same=["rc","nif","nis","role","qualif","casnos"].includes(TYPE2[d.type])?S.pieces[TYPE2[d.type]]:null;
        if(same&&!same.deleted){h+=`توجد وثيقة من نفس النوع: سيتم <b>استبدالها</b> (القديمة إلى الأرشيف).<br>`;ED.id=same.id;ED.p=same;["Fr","Ar"].forEach(k=>$("#e"+k).value=same[k.toLowerCase()]||"");}}
      if(cat==="bilan"&&x.years.length&&!$("#eYear").value)$("#eYear").value=Math.max(...x.years.filter(y=>y<=new Date().getFullYear()));}
    const v=validityIn(t);if(v){setV("eFin",v);h+=`تاريخ الصلاحية المقروء: <b>${fd(v)}</b><br>`;}
    if(ds.length){setV("eDate",ds.filter(s=>s<=today()).pop()||"");if(!v){const fut=ds.filter(s=>s>today());if(fut.length)setV("eFin",fut[fut.length-1]);}h+=`التواريخ المقروءة: ${ds.map(fd).join("، ")}<br>`;}
    const c=$("#eCat")?$("#eCat").value:ED.cat;
    if(String(c).startsWith("abe")){const a=extractABE(t);setV("eTitle",a.proj_ar);setV("eOwA",a.owner_ar);setV("eAmt",a.amount);setV("eCtr",a.contract);setV("eDel",a.delay_n?a.delay_n+(a.delay_u==="mois"?" أشهر":" يوما"):"");
      if(a.contract_date)setV("eRY",a.contract_date.slice(0,4));if(a.reception)setV("eDate",a.reception);if(a.pipes)setV("ePip",a.pipes.map(x=>(x.dn?"Ø"+x.dn:"")+(x.mat?" "+x.mat:"")+": "+x.len).join(" ; "));
      h+=`قُرئت معلومات الشهادة (المشروع، المبلغ، الصفقة، الأطوال) — راجعها قبل الحفظ.<br>`;}}
  else if(!t)h+=`<span class="mu">لم يُقرأ النص — املأ الخانات يدوياً.</span>`;
  msg(h);}
/* شهادة حسن التنفيذ → المذكرة التقنية (المراجع) : نفس المعلومات، بدون الملفات */
async function syncMemo(p){if(!p||!String(p.cat).startsWith("abe")||viewer())return;try{const base=PARC.base+"_memo";const refs=await fget(PARC,base+"/refs")||[];
  const yr=String(p.refYear||((p.contract||"").match(/20\d\d/)||[])[0]||(p.date||"").slice(0,4));
  const data={cat:p.cat==="abe_aep"?"aep":p.cat==="abe_ass"?"ass":"autre",year:yr,amount:+p.amount||0,contract:p.contract||"",owner_ar:p.owner_ar||"",owner_fr:p.owner_fr||"",proj_ar:p.proj_ar||p.title||"",proj_fr:p.proj_fr||"",delay_ar:p.delay_ar||"",delay_fr:p.delay_fr||"",dosId:p.id};
  const r=refs.find(x=>x&&x.dosId===p.id);
  if(p.deleted){if(r)r.sel=false;}else if(r)Object.keys(data).forEach(k=>{if(data[k]!==""&&data[k]!==0)r[k]=data[k];});else refs.push(Object.assign({sel:true},data));
  await fput(PARC,base+"/refs",refs);await fput(PARC,base+"/lastSave",new Date().toISOString());}catch(e){console.warn("memo",e);}}
function drawThumbs(){$("#eTh").innerHTML=ED.pages.map((p,i)=>`<div class="th"><img src="${thumb(p)}"><div>${i+1}</div><button class="b" onclick="rotP(${i})">⟳</button><button class="b" onclick="movP(${i})">▲</button><button class="b" onclick="ED.pages.splice(${i},1);drawThumbs()">✕</button></div>`).join("");}
function thumb(p){const cv=rotCv(p.cv,p.rot),s=Math.min(1,260/Math.max(cv.width,cv.height)),c=document.createElement("canvas");c.width=cv.width*s;c.height=cv.height*s;c.getContext("2d").drawImage(cv,0,0,c.width,c.height);return c.toDataURL("image/jpeg",0.7);}
function rotCv(cv,r){if(!r)return cv;const c=document.createElement("canvas");c.width=r%180?cv.height:cv.width;c.height=r%180?cv.width:cv.height;const x=c.getContext("2d");x.translate(c.width/2,c.height/2);x.rotate(r*Math.PI/180);x.drawImage(cv,-cv.width/2,-cv.height/2);return c;}
function rotP(i){ED.pages[i].rot=(ED.pages[i].rot+90)%360;drawThumbs();}
function movP(i){if(i>0){const t=ED.pages[i];ED.pages[i]=ED.pages[i-1];ED.pages[i-1]=t;drawThumbs();}}
const slug=s=>String(s||"").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,30)||"piece";
async function savePiece(){if(viewer()){toast("حساب العرض فقط");return;}
  const cat=ED.id?ED.p.cat:$("#eCat").value;if(!cat){toast("اختر الصنف");return;}
  const old=ED.id?S.pieces[ED.id]:null;if(!old&&!ED.pages.length){toast("اختر ملف الوثيقة");return;}
  const id=ED.id||(cat+"_"+($("#eYear").value||slug($("#eFr").value))+"_"+Date.now().toString(36));
  const v=old?(old.v||1)+(ED.pages.length?1:0):1;
  const rec=Object.assign({},old||{id,cat,ord:Date.now()%100000,layout:"single"},{fr:$("#eFr").value.trim()||(old&&old.fr)||CATS[cat][1],ar:$("#eAr").value.trim()||(old&&old.ar)||CATS[cat][0],title:$("#eTitle").value.trim(),
    date:$("#eDate").value,fin:$("#eFin").value,bank:$("#eBank").value.trim(),duplex:$("#eDup").checked,v,t:Date.now(),by:"app"});
  const yr=+$("#eYear").value;if(yr)rec.year=yr;const ca=+$("#eCa").value;if(ca)rec.ca=ca;
  if(String(cat).startsWith("abe")){rec.proj_ar=$("#eTitle").value.trim();rec.title=rec.proj_ar;rec.owner_ar=$("#eOwA").value.trim();rec.owner_fr=$("#eOwF").value.trim();rec.proj_fr=$("#ePrF").value.trim();rec.amount=+$("#eAmt").value||0;rec.contract=$("#eCtr").value.trim();
    const dl=$("#eDel").value.trim();rec.delay_ar=dl;rec.delay_fr=dl.replace(/يوما|يوم/,"jours").replace(/أشهر|اشهر|شهرا|شهر/,"mois");rec.refYear=$("#eRY").value.trim();const pp=parsePipes($("#ePip").value);if(pp.length){rec.pipes=pp;rec.length=pp.reduce((a,x)=>a+x.len,0);rec.pipesAuto=false;}else{delete rec.pipes;delete rec.length;}
    if(ED.text)rec.ocrText=ED.text.slice(0,6000);}
  try{
    if(ED.pages.length){const b=writeBase(),bc=baseConf(b),refs=[];
      for(let i=0;i<ED.pages.length;i++){prog("رفع الصفحات…",i/ED.pages.length);const cv=rotCv(ED.pages[i].cv,ED.pages[i].rot),src=cv.toDataURL("image/jpeg",0.72),k=`${id}_v${v}_p${i}`;
        await fput(bc,D+"/pages/"+k,src);await cset("d:"+k,src);refs.push({k,b,w:cv.width,h:cv.height,n:Math.round(src.length*0.75)});}
      if(old)await fput(DOSSIER,D+"/piecesHist/"+id+"/v"+old.v,old);
      rec.pages=refs;}
    await fput(DOSSIER,D+"/pieces/"+id,rec);S.pieces[id]=rec;syncMemo(rec);
    if(ED.text&&window.EGTPHDoc){const typ={rc:"registre_commerce",nif:"nif",nis:"nis",role:"extrait_role",qualif:"qualification",casnos:"casnos"}[id]||{bilan:"bilan",rib:"rib",abe_ass:"bonne_execution",abe_aep:"bonne_execution",abe_autre:"bonne_execution",das:"das",matdoc:"pv",matfact:"facture"}[cat]||null;
      if(typ){S.model=S.model||EGTPHDoc.newModel();EGTPHDoc.train(S.model,typ,ED.text.slice(0,4000));fput(DOSSIER,D+"/ai/model",S.model).catch(()=>{});}}
    prog(false);closeModal();toast("حُفظت الوثيقة ✓");render();
  }catch(e){prog(false);toast("تعذّر الحفظ: "+e.message,4000);}}
async function restoreOld(id){const h=await fget(DOSSIER,D+"/piecesHist/"+id).catch(()=>null);if(!h){toast("لا أرشيف");return;}
  const vs=Object.values(h).sort((a,b)=>b.v-a.v);modal(`<h3>نسخ سابقة</h3>${vs.map(o=>`<div class="row"><div class="t"><b>النسخة ${o.v}</b><span>${new Date(o.t).toLocaleDateString("fr-FR")} · ${(o.pages||[]).length} ص</span></div><button class="b" onclick="doRestore('${id}',${o.v})">↩ استرجاع</button></div>`).join("")}<button class="b" onclick="closeModal()">إغلاق</button>`);}
async function doRestore(id,v){const o=await fget(DOSSIER,D+"/piecesHist/"+id+"/v"+v);const cur=S.pieces[id];await fput(DOSSIER,D+"/piecesHist/"+id+"/v"+cur.v,cur);
  const rec=Object.assign({},o,{v:Math.max(cur.v,o.v)+1,t:Date.now(),restoredFrom:v});await fput(DOSSIER,D+"/pieces/"+id,rec);S.pieces[id]=rec;closeModal();toast("استُرجعت النسخة "+v);render();}
async function delPiece(id){if(!confirm("حذف هذه الوثيقة من الملف؟ (تبقى في الأرشيف)"))return;const cur=S.pieces[id];await fput(DOSSIER,D+"/piecesHist/"+id+"/v"+cur.v,cur);
  await fput(DOSSIER,D+"/pieces/"+id,{id,deleted:true,t:Date.now()});S.pieces[id]={id,deleted:true};syncMemo(Object.assign({},cur,{deleted:true}));closeModal();render();}
